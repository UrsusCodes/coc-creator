<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Zew Cthulhu — Kreator Badacza</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Force reload + fix broken state if cached version is outdated
      (function() {
        var v = '20260321c';
        if (localStorage.getItem('app_version') !== v) {
          // Clear corrupted wizard state — server drafts are safe
          localStorage.removeItem('coc-character-wizard');
          localStorage.setItem('app_version', v);
          location.reload();
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
